# Not yet exercised on GitHub (the repository has not been pushed): adjust
# runner images / versions if a step fails on first use.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Build (host, Raspberry Pi, VPS)
        run: |
          go build ./...
          GOOS=linux GOARCH=arm64 go build ./cmd/...
          GOOS=linux GOARCH=amd64 go build ./cmd/...
      - name: Test
        run: go test ./...
      - name: Test (race detector)
        run: go test -race ./internal/raft/... ./internal/fsm/ ./internal/server/ ./internal/chaos/ ./internal/client/...
      - name: Raft simulation sweep
        run: RAFT_SIM_SEEDS=20000 go test ./internal/raft/ -run Sim -count=1 -timeout 30m

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The committed bundle matches the sources
        run: |
          npm run build
          git diff --exit-code -- dist
